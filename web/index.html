<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ANIMA — agent payments with receipts</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/fraunces@5.2.9/index.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/inter@5.2.8/index.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-mono@5.2.7/400.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@32.3.3/styles/ag-grid.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@32.3.3/styles/ag-theme-quartz.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/ag-grid-community@32.3.3/dist/ag-grid-community.min.js"></script>
</head>
<body>
  <div class="anima-ambient" id="anima-ambient" aria-hidden="true"></div>
  <header class="bar">
    <div class="mark" aria-label="ANIMA">
      <svg class="mark-seal" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14.5"/><circle cx="16" cy="16" r="10"/><path d="M11 16.5l3.4 3.4L21.5 12.6"/></svg>
      <span>ANIMA</span>
    </div>
    <p class="status" id="status" aria-live="polite"></p>
    <div class="lang" id="lang" role="group" aria-label="Language">
      <button type="button" data-lang="fr">FR</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="hero-copy">
        <p class="eyebrow" id="t-eyebrow"></p>
        <h1 id="t-question"></h1>
        <p class="lede" id="t-lede"></p>
        <div class="cta">
          <button type="button" class="primary" id="run-poison"></button>
          <button type="button" class="ghost" id="run-first"></button>
        </div>
        <p class="prove-jump"><a href="#prove" id="prove-jump">Don't trust us. Break it →</a></p>
        <ol class="chain" id="chain" aria-label="How money moves"></ol>
        <button type="button" class="ambient-toggle" id="ambient-toggle" aria-pressed="false" aria-label="Pause ambient background">Pause ambient background</button>
      </div>
      <article class="doc mandate" id="mandate-card">
        <header class="doc-head">
          <span class="doc-kind" id="t-mandate-kind"></span>
          <span class="doc-id" id="mandate-id"></span>
        </header>
        <h2 id="t-mandate-title"></h2>
        <p class="muted" id="t-mandate-hint"></p>
        <dl id="mandate"></dl>
        <footer class="signature">
          <span class="sig-line" id="mandate-signer"></span>
          <span class="sig-label" id="t-mandate-signed"></span>
        </footer>
      </article>
    </section>

    <!-- Real AV0 only: private localhost visual gate. Hidden without verified frames. -->
    <section class="asso-presence" id="asso-presence" aria-label="Asso, la présence qui accompagne sans autoriser" hidden>
      <div class="asso-presence__copy">
        <p class="eyebrow" id="asso-presence-eyebrow">ANIMA × ASSO · LABORATOIRE PRIVÉ</p>
        <h2><span id="asso-presence-title">Une présence pour comprendre.</span><br><em id="asso-presence-boundary">Jamais pour autoriser.</em></h2>
        <p id="asso-presence-description">Asso est à tes côtés pour rendre les faits compréhensibles. La décision, les autorisations et la preuve restent dans ANIMA.</p>
        <span class="asso-presence__status" id="asso-presence-status" role="status"></span>
      </div>
      <div class="asso-presence__figure">
        <canvas id="asso-presence-canvas" width="660" height="630" role="img" aria-label="Véritable buste animé du moteur AV0, fondu dans l'interface ANIMA"></canvas>
      </div>
    </section>

    <section class="cases" aria-labelledby="t-scenes-title">
      <header class="section-head">
        <h2 id="t-scenes-title"></h2>
        <p class="muted" id="t-scenes-hint"></p>
      </header>
      <div id="scenes" class="case-rail"></div>
      <div class="scene-tools"><button class="ghost small" id="reset"></button></div>
    </section>

    <section class="theatre" id="theatre" hidden aria-live="polite"></section>

    <section class="notice" id="last-run" hidden></section>

    <section class="panel move" id="pending-panel">
      <header class="section-head">
        <h2><span id="t-waiting-title"></span> <span class="count" id="pending-count"></span></h2>
        <p class="muted" id="pending-empty"></p>
      </header>
      <div id="pending"></div>
    </section>

    <section class="panel" id="trust-card">
      <header class="section-head">
        <h2 id="t-trust-title"></h2>
        <p class="muted" id="t-trust-hint"></p>
      </header>
      <div id="trust"></div>
    </section>

    <section class="proofs" aria-labelledby="t-receipts-title">
      <header class="section-head">
        <h2 id="t-receipts-title"></h2>
        <p class="muted" id="t-receipts-hint"></p>
      </header>
      <div id="proofs" class="proof-rail"></div>
      <details class="forensic" id="forensic">
        <summary><span id="t-forensic"></span> <span class="count" id="forensic-count"></span></summary>
        <div class="proof-overview" id="proof-overview" hidden>
          <header class="proof-heading">
            <h3 id="t-proof-heading"></h3>
            <p class="muted" id="t-proof-hint"></p>
          </header>
          <div class="proof-metrics" id="proof-metrics" aria-live="polite"></div>
          <div class="proof-toolbar">
            <div id="proof-scopes" class="proof-scopes" role="group" aria-label="Receipt filters">
              <button type="button" class="ghost small" data-proof-scope="all"></button>
              <button type="button" class="ghost small" data-proof-scope="moved"></button>
              <button type="button" class="ghost small" data-proof-scope="notMoved"></button>
              <button type="button" class="ghost small" data-proof-scope="corrected"></button>
            </div>
            <label for="proof-search" id="t-proof-search" class="proof-search-label"></label>
            <input id="proof-search" type="search" autocomplete="off" aria-describedby="proof-shown">
            <output id="proof-shown" aria-live="polite"></output>
          </div>
          <div id="grid" class="grid"></div>
          <p class="proof-footnote muted" id="t-proof-footnote"></p>
        </div>
      </details>
    </section>
    <section class="prove" id="prove" aria-labelledby="prove-title"></section>
  </main>

  <aside class="drawer" id="drawer" aria-hidden="true">
    <button class="close" id="drawer-close" aria-label="Close">×</button>
    <div id="drawer-body"></div>
  </aside>

  <footer class="foot"><span id="catchphrase"></span></footer>
  <script src="firewall.js"></script>
  <script src="theatre.js"></script>
  <script src="proof-lens.js"></script>
  <script src="asso-presence.js"></script>
  <script src="av0-native-local.js"></script>
  <script src="app.js"></script>
  <script src="prove.js"></script>
  <script src="ambient.js"></script>
</body>
</html>
